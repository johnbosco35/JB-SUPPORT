services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongo:27017/refunds
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on: [mongo]
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  mongo-data:
